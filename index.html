<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VISOR</title>
    
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
    <link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
    <link rel="manifest" href="site.webmanifest">
    <link rel="shortcut icon" href="favicon.ico">
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#000000">
    
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: rgba(30, 30, 30, 0.7);
            --card-hover: rgba(50, 50, 50, 0.8);
            --text-main: #ffffff;
            --text-dim: #bbbbbb; 
            --accent-safe: #00ff9d; 
            --accent-warn: #ffca00; 
            --accent-risk: #ff5e5e; 
            --accent-cold: #00d5ff; 
            --commuter-bg: rgba(0,0,0,0.5);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            transition: background 1s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .header {
            width: 100%;
            max-width: 600px;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-bottom: 20px;
            position: relative;
        }
        h1 { margin: 0; font-size: 2rem; letter-spacing: 4px; font-weight:900; font-style: italic; text-shadow: 0 2px 10px rgba(0,0,0,0.5); }
        
        .location-bar {
            width: 100%;
            max-width: 600px;
            display: flex;
            gap: 8px;
            margin-bottom: 10px;
        }
        #locInput {
            flex: 1;
            padding: 14px;
            font-size: 1rem;
            border-radius: 12px;
            border: none;
            background: var(--card-bg);
            color: white;
            min-width: 0;
            backdrop-filter: blur(5px);
        }
        .action-btn {
            padding: 0 16px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            background: var(--card-bg);
            color: white;
            cursor: pointer;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 50px;
            font-size: 1.2rem;
            backdrop-filter: blur(5px);
        }
        .action-btn.primary { background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.2); }

        #currentLocDisplay {
            color: var(--text-dim);
            margin-bottom: 20px;
            font-size: 1rem;
            width: 100%;
            max-width: 600px;
            text-shadow: 0 1px 2px rgba(0,0,0,0.8);
            padding-left: 5px;
        }

        .score-card {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            border-radius: 20px;
            padding: 25px 20px;
            margin-bottom: 15px; 
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            border: 1px solid rgba(255,255,255,0.1);
            backdrop-filter: blur(10px);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .score-left { text-align: left; max-width: 50%; }
        .score-right { 
            text-align: right; 
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 10px;
        }

        .date-label { font-size: 0.9rem; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 8px; display:block;}

        .stat-temp-row { font-size: 3.5rem; font-weight: 700; line-height: 1; margin-bottom: 2px; }
        .stat-feel-row { font-size: 1.1rem; color: var(--text-dim); margin-bottom: 8px; }
        
        .stat-wind-row, .stat-rain-row { font-size: 1.4rem; font-weight: 600; display: flex; align-items: center; justify-content: flex-end; gap: 8px; }
        .wind-arrow { display: inline-block; font-size: 1.4rem; transform-origin: center; }

        .action-container {
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 25px;
        }
        .full-btn {
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-weight: bold;
            font-size: 0.95rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border: none;
            transition: transform 0.2s;
        }
        .full-btn:active { transform: scale(0.98); }
        .btn-fuel { background: #1a1a1a; color: var(--accent-warn); border: 1px solid var(--accent-warn); }
        .btn-med { background: #1a1a1a; color: var(--accent-risk); border: 1px solid var(--accent-risk); }
        .btn-sos { background: #1a1a1a; color: var(--accent-cold); border: 1px solid var(--accent-cold); }

        .commuter-container { width: 100%; max-width: 600px; margin-bottom: 25px; }
        .commuter-label { font-size: 0.9rem; color:#ccc; margin-bottom:8px; text-transform: uppercase; letter-spacing: 1px; text-shadow: 0 1px 2px black;}
        .commuter-bar { display: flex; height: 20px; border-radius: 6px; overflow: hidden; background: var(--commuter-bg); border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(5px); }
        .hour-block { flex: 1; height: 100%; margin-right: 1px; position: relative; }
        .hour-block:last-child { margin-right: 0; }

        .commuter-axis { display: flex; margin-top: 6px; width: 100%; }
        .axis-tick { flex: 1; text-align: center; font-size: 0.8rem; color: #ccc; position: relative; height: 15px; text-shadow: 0 1px 2px black; }
        .axis-tick::before { content: ''; display: block; width: 1px; height: 4px; background: #ccc; margin: 0 auto 2px auto; visibility: hidden; }
        .axis-tick.visible::before { visibility: visible; }
        
        .alerts-container { width: 100%; max-width: 600px; display: flex; flex-wrap: wrap; gap: 10px; margin-bottom: 25px; }
        .badge { padding: 8px 14px; border-radius: 8px; font-size: 0.95rem; font-weight: bold; display: flex; align-items: center; gap: 8px; backdrop-filter: blur(5px); box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        .badge.warn { background: rgba(255, 202, 0, 0.2); color: var(--accent-warn); border: 1px solid var(--accent-warn); }
        .badge.risk { background: rgba(255, 94, 94, 0.2); color: var(--accent-risk); border: 1px solid var(--accent-risk); }
        .badge.cold { background: rgba(0, 213, 255, 0.2); color: var(--accent-cold); border: 1px solid var(--accent-cold); }
        .badge.safe { background: rgba(0, 255, 157, 0.15); color: var(--accent-safe); border: 1px solid var(--accent-safe); }

        .chart-container { width: 100%; max-width: 600px; background: var(--card-bg); border-radius: 20px; padding: 15px; margin-bottom: 25px; height: 320px; position: relative; box-shadow: 0 8px 32px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(10px); }
        .legend-row { display: flex; justify-content: center; gap: 20px; font-size: 0.9rem; color: #ccc; margin-bottom: 15px; }
        .dot { width: 12px; height: 12px; border-radius: 50%; display: inline-block; margin-right: 6px; }

        .forecast-header { width: 100%; max-width: 600px; margin-bottom: 12px; font-size: 1rem; color: #ccc; text-transform: uppercase; letter-spacing: 1px; text-shadow: 0 1px 2px black; font-weight: bold; }
        .forecast-list { width: 100%; max-width: 600px; }
        .forecast-item { background: var(--card-bg); margin-bottom: 12px; padding: 18px; border-radius: 16px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; border: 1px solid rgba(255,255,255,0.05); transition: background 0.2s; backdrop-filter: blur(5px); }
        .forecast-item:hover { background: var(--card-hover); }
        .forecast-item.active { border: 1px solid #fff; background: var(--card-hover); }
        
        .f-day { font-weight: bold; font-size: 1.2rem; }
        .f-detail { color: var(--text-dim); font-size: 1.1rem; display: flex; align-items: center; gap: 15px;}
        
        .loader { display: none; border: 4px solid #333; border-top: 4px solid var(--accent-safe); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="header">
        <h1>VISOR</h1>
    </div>

    <div class="location-bar">
        <button class="action-btn" id="gpsBtn" onclick="getLocation()">📍</button>
        <input type="text" id="locInput" placeholder="Αναζήτηση...">
        <button class="action-btn primary" id="searchBtn" onclick="searchLocation()">🔍</button>
        <button class="action-btn" onclick="toggleLang()" id="langBtn">EL</button>
    </div>
    <div id="currentLocDisplay"></div>

    <div class="loader" id="loader"></div>

    <div class="score-card" id="scoreCard">
        <div class="score-left">
            <span class="date-label" id="dateLabel">TODAY</span>
            <div class="stat-temp-row">
                <span id="tempStat">--</span><span style="font-size:1.5rem; vertical-align: super;">°</span>
            </div>
            <div class="stat-feel-row">
                <span id="feelLabel">Feels</span> <span id="feelStat">--°</span>
            </div>
        </div>
        <div class="score-right">
            <div class="stat-rain-row">
                <span id="rainStat">--%</span> 🌧️
            </div>
            <div class="stat-wind-row">
                <span id="windStat">--</span> 
                <span class="wind-arrow" id="windArrow">⬇</span> 💨
            </div>
        </div>
    </div>

    <div class="action-container">
        <button class="full-btn btn-fuel" onclick="findFuel()" id="fuelBtn">
            ⛽ ΚΟΝΤΙΝΟΤΕΡΟ ΠΡΑΤΗΡΙΟ ΚΑΥΣΙΜΩΝ
        </button>
        <button class="full-btn btn-med" onclick="findMedical()" id="medBtn">
            🏥 ΝΟΣΟΚΟΜΕΙΟ / ΚΕΝΤΡΟ ΥΓΕΙΑΣ
        </button>
        <button class="full-btn btn-sos" onclick="findSOS()" id="sosBtn">
            🆘 ΟΔΙΚΗ ΒΟΗΘΕΙΑ (ΑΥΤΟΚΙΝΗΤΟΔΡΟΜΟΣ / 112)
        </button>
    </div>

    <div class="commuter-container">
        <div class="commuter-label" id="commuterTitle">24H Timeline</div>
        <div class="commuter-bar" id="commuterBar"></div>
        <div class="commuter-axis" id="commuterAxis"></div>
    </div>

    <div class="alerts-container" id="alertsContainer"></div>

    <div class="chart-container">
        <div class="legend-row">
            <span><span class="dot" style="background:#00ff9d"></span><span id="legTemp">Temp</span></span>
            <span><span class="dot" style="background:#00d5ff"></span><span id="legRain">Rain %</span></span>
            <span><span class="dot" style="background:rgba(20, 20, 60, 0.8)"></span><span id="legNight">Night</span></span>
        </div>
        <canvas id="weatherChart"></canvas>
    </div>

    <div class="forecast-header" id="forecastHeader">Forecast</div>
    <div class="forecast-list" id="forecastList"></div>

    <script>
        let currentLang = 'el'; 
        let currentLat = 37.9838; 
        let currentLon = 23.7275;
        let chartInstance = null;
        let weatherDataCache = null; 
        let selectedDayIndex = 0; 
        let currentCityName = "Unknown";
        let rawApiData = null; // Stored to instantly update current temp on day toggle

        const STRINGS = {
            en: {
                placeholder: "Search City...",
                warnCold: "Chilly (<10°C)",
                warnFreeze: "Ice Possible",
                warnWind: "High Wind",
                warnFog: "Foggy",
                warnRain: "Rain Expected",
                warnStorm: "Intense Weather",
                warnWet: "Wet Roads",
                days: ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'],
                today: "TODAY",
                forecastTitle: "Select Day",
                commuterTitle: "Timeline",
                feels: "Feels",
                safe: "Clear Conditions",
                legTemp: "Temp",
                legRain: "Rain %",
                legNight: "Night",
                fuelBtn: "⛽ NEAREST GAS STATION",
                medBtn: "🏥 MEDICAL / URGENT CARE",
                sosBtn: "🆘 ROADSIDE ASSIST (MOTORWAY / 112)",
                searchStr: "SEARCHING...",
                noneStr: "NONE WITHIN 50KM",
                errStr: "API ERROR",
                gasStation: "Gas Station",
                medicalCenter: "Medical Facility"
            },
            el: {
                placeholder: "Αναζήτηση Πόλης...",
                warnCold: "Κρύο (<10°C)",
                warnFreeze: "Πιθανός Πάγος",
                warnWind: "Ισχυρός Άνεμος",
                warnFog: "Ομίχλη",
                warnRain: "Πιθανή Βροχή",
                warnStorm: "Έντονα Φαινόμενα", 
                warnWet: "Υγρό Οδόστρωμα", 
                days: ['Κυρ', 'Δευ', 'Τρι', 'Τετ', 'Πεμ', 'Παρ', 'Σαβ'],
                today: "ΣΗΜΕΡΑ",
                forecastTitle: "Επιλογη Hμερας",
                commuterTitle: "Χρονολογιο",
                feels: "Αίσθηση",
                safe: "Καλές Συνθήκες",
                legTemp: "Θερμ.",
                legRain: "Βροχή %",
                legNight: "Νύχτα",
                fuelBtn: "⛽ ΚΟΝΤΙΝΟΤΕΡΟ ΠΡΑΤΗΡΙΟ ΚΑΥΣΙΜΩΝ",
                medBtn: "🏥 ΝΟΣΟΚΟΜΕΙΟ / ΚΕΝΤΡΟ ΥΓΕΙΑΣ",
                sosBtn: "🆘 ΟΔΙΚΗ ΒΟΗΘΕΙΑ (ΑΥΤΟΚΙΝΗΤΟΔΡΟΜΟΣ / 112)",
                searchStr: "ΑΝΑΖΗΤΗΣΗ...",
                noneStr: "ΚΑΝΕΝΑ ΣΤΑ 50km",
                errStr: "ΣΦΑΛΜΑ ΔΙΚΤΥΟΥ",
                gasStation: "Βενζινάδικο",
                medicalCenter: "Ιατρικό Κέντρο"
            }
        };

        window.onload = () => {
            const savedLat = localStorage.getItem('motoLat');
            const savedLon = localStorage.getItem('motoLon');
            const savedName = localStorage.getItem('motoName');
            
            Chart.defaults.font.size = 13;
            Chart.defaults.color = '#ccc';
            
            if(savedLat && savedLon) {
                currentLat = parseFloat(savedLat);
                currentLon = parseFloat(savedLon);
                currentCityName = savedName || "Saved Location";
                document.getElementById('currentLocDisplay').innerText = currentCityName;
                fetchWeather(); 
            } else {
                fetchWeather(); 
                getLocation(); 
            }
            
            updateStaticText();
        };

        function toggleLang() {
            currentLang = currentLang === 'en' ? 'el' : 'en';
            updateStaticText();
            if(weatherDataCache) renderDashboard(selectedDayIndex); 
        }

        function updateStaticText() {
            const t = STRINGS[currentLang];
            document.getElementById('langBtn').innerText = currentLang.toUpperCase();
            document.getElementById('locInput').placeholder = t.placeholder;
            document.getElementById('forecastHeader').innerText = t.forecastTitle;
            document.getElementById('commuterTitle').innerText = t.commuterTitle;
            document.getElementById('legTemp').innerText = t.legTemp;
            document.getElementById('legRain').innerText = t.legRain;
            document.getElementById('legNight').innerText = t.legNight;
            document.getElementById('feelLabel').innerText = t.feels;
            
            resetActionButtons();
        }

        function resetActionButtons() {
            const t = STRINGS[currentLang];
            
            const btnF = document.getElementById('fuelBtn');
            btnF.innerText = t.fuelBtn;
            btnF.style.background = "#1a1a1a";
            btnF.style.color = "var(--accent-warn)";
            btnF.onclick = findFuel;

            const btnM = document.getElementById('medBtn');
            btnM.innerText = t.medBtn;
            btnM.style.background = "#1a1a1a";
            btnM.style.color = "var(--accent-risk)";
            btnM.onclick = findMedical;

            const btnS = document.getElementById('sosBtn');
            btnS.innerText = t.sosBtn;
            btnS.style.background = "#1a1a1a";
            btnS.style.color = "var(--accent-cold)";
            btnS.onclick = findSOS;
        }

        async function fetchWeather() {
            document.getElementById('loader').style.display = 'block';
            document.getElementById('scoreCard').style.opacity = '0.5';

            const url = `https://api.open-meteo.com/v1/forecast?latitude=${currentLat}&longitude=${currentLon}&hourly=temperature_2m,apparent_temperature,precipitation_probability,precipitation,weathercode,windgusts_10m,winddirection_10m,visibility&daily=weathercode,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset&timezone=auto&forecast_days=4`;

            try {
                const response = await fetch(url);
                const data = await response.json();
                rawApiData = data; // Cache full response for live lookups
                processData(data);
                updateDynamicBackground(data.daily.sunrise[0], data.daily.sunset[0]);
                resetActionButtons();
            } catch (error) {
                console.error(error);
            } finally {
                document.getElementById('loader').style.display = 'none';
                document.getElementById('scoreCard').style.opacity = '1';
            }
        }

        function processData(data) {
            let structuredDays = [];

            for (let d = 0; d < 4; d++) {
                let startIdx = d * 24;
                let endIdx = startIdx + 24;
                
                const sunrise = new Date(data.daily.sunrise[d]).getHours();
                const sunset = new Date(data.daily.sunset[d]).getHours();

                let dayObj = {
                    date: data.daily.time[d],
                    sunrise: sunrise,
                    sunset: sunset,
                    dailyMin: Math.round(data.daily.temperature_2m_min[d]),
                    dailyMax: Math.round(data.daily.temperature_2m_max[d]),
                    dailyRainProb: data.daily.precipitation_probability_max[d],
                    hourly: {
                        times: [], temps: [], rain: [], wind: [], vis: [], wetRoad: []
                    },
                    stats: {
                        maxWind: 0, avgWindDir: 0, minTemp: 100, minFeel: 100,
                        hasRain: false, isStorm: false, hasWetRoad: false, alerts: []
                    }
                };

                let windDirSum = 0;
                let count = 0;

                for (let h = startIdx; h < endIdx; h++) {
                    if (!data.hourly.time[h]) continue;

                    const temp = data.hourly.temperature_2m[h];
                    const feel = data.hourly.apparent_temperature[h];
                    const rainP = data.hourly.precipitation_probability[h];
                    const precipAmount = data.hourly.precipitation[h];
                    const gust = data.hourly.windgusts_10m[h];
                    const dir = data.hourly.winddirection_10m[h];
                    const vis = data.hourly.visibility[h];
                    const code = data.hourly.weathercode[h];
                    
                    const dateObj = new Date(data.hourly.time[h]);
                    dayObj.hourly.times.push(dateObj.getHours() + ':00');
                    dayObj.hourly.temps.push(temp);
                    dayObj.hourly.rain.push(rainP);
                    
                    let isWet = false;
                    if (h > 0) {
                        const prevPrecip = data.hourly.precipitation[h-1];
                        if (prevPrecip > 1.5) isWet = true; 
                    }
                    if (precipAmount > 0.5) isWet = true; 
                    
                    dayObj.hourly.wetRoad.push(isWet);
                    if(isWet) dayObj.stats.hasWetRoad = true;

                    if (gust > dayObj.stats.maxWind) dayObj.stats.maxWind = gust;
                    if (temp < dayObj.stats.minTemp) dayObj.stats.minTemp = temp;
                    if (feel < dayObj.stats.minFeel) dayObj.stats.minFeel = feel;
                    if (rainP > 40) dayObj.stats.hasRain = true;
                    if ([95, 96, 99, 71, 73, 75, 77].includes(code)) dayObj.stats.isStorm = true;

                    windDirSum += dir;
                    count++;

                    if (temp < 0 && !dayObj.stats.alerts.includes('freeze')) dayObj.stats.alerts.push('freeze');
                    else if (temp < 10 && !dayObj.stats.alerts.includes('cold')) dayObj.stats.alerts.push('cold');
                    if (gust > 50 && !dayObj.stats.alerts.includes('wind')) dayObj.stats.alerts.push('wind');
                    if (vis < 1000 && !dayObj.stats.alerts.includes('fog')) dayObj.stats.alerts.push('fog');
                }

                dayObj.stats.avgWindDir = count > 0 ? windDirSum / count : 0;
                structuredDays.push(dayObj);
            }

            weatherDataCache = structuredDays;
            renderForecastList(); 
            selectDay(0); 
        }

        function selectDay(index) {
            selectedDayIndex = index;
            renderDashboard(index);
            updateListSelection(index);
        }

        function renderDashboard(dayIndex) {
            if(!weatherDataCache || !rawApiData) return;
            const t = STRINGS[currentLang];
            const dayData = weatherDataCache[dayIndex];
            const stats = dayData.stats;

            const dateObj = new Date(dayData.date);
            const dayName = t.days[dateObj.getDay()];
            const headerText = dayIndex === 0 ? `${t.today} (${dayName})` : dayName + ` ${dateObj.getDate()}`;
            document.getElementById('dateLabel').innerText = headerText;

            // --- LIVE TEMPERATURE FIX ---
            let displayTemp, displayFeel;
            if (dayIndex === 0) {
                // Find exact current hour index from raw API data
                const nowIsoString = new Date().toISOString().slice(0, 14) + "00"; // e.g. 2026-06-06T15:
                let currentHourIdx = rawApiData.hourly.time.findIndex(t => t.startsWith(nowIsoString.slice(0, 13)));
                if (currentHourIdx === -1) currentHourIdx = 0; // Fallback
                
                displayTemp = Math.round(rawApiData.hourly.temperature_2m[currentHourIdx]);
                displayFeel = Math.round(rawApiData.hourly.apparent_temperature[currentHourIdx]);
            } else {
                // For future days, show peak or average representation (Max/Min midpoint or Max)
                displayTemp = dayData.dailyMax;
                displayFeel = dayData.dailyMax;
            }

            document.getElementById('tempStat').innerText = displayTemp;
            document.getElementById('feelStat').innerText = displayFeel + "°";
            document.getElementById('windStat').innerText = Math.round(stats.maxWind) + " km/h";
            document.getElementById('rainStat').innerText = dayData.dailyRainProb + "%";
            document.getElementById('windArrow').style.transform = `rotate(${stats.avgWindDir + 180}deg)`;

            const barContainer = document.getElementById('commuterBar');
            const axisContainer = document.getElementById('commuterAxis');
            barContainer.innerHTML = '';
            axisContainer.innerHTML = '';
            
            for(let i=0; i<dayData.hourly.times.length; i++) {
                const hourDiv = document.createElement('div');
                hourDiv.className = 'hour-block';
                const hTemp = dayData.hourly.temps[i];
                const hRainP = dayData.hourly.rain[i];
                const isWet = dayData.hourly.wetRoad[i];
                
                let bg = 'var(--accent-safe)'; 
                if(hTemp < 10) bg = 'var(--accent-warn)';
                if(hRainP > 40 || isWet) bg = 'var(--accent-risk)';
                
                hourDiv.style.background = bg;
                barContainer.appendChild(hourDiv);

                const axisDiv = document.createElement('div');
                axisDiv.className = 'axis-tick';
                if (i % 3 === 0) { 
                    axisDiv.innerText = i; 
                    axisDiv.classList.add('visible');
                }
                axisContainer.appendChild(axisDiv);
            }

            const alertsCont = document.getElementById('alertsContainer');
            alertsCont.innerHTML = '';

            if (stats.isStorm) createBadge(t.warnStorm, 'risk');
            if (stats.hasWetRoad) createBadge(t.warnWet, 'risk');
            if (stats.alerts.includes('freeze')) createBadge(t.warnFreeze, 'risk');
            if (stats.alerts.includes('wind')) createBadge(t.warnWind, 'warn');
            if (stats.alerts.includes('fog')) createBadge(t.warnFog, 'warn');
            if (stats.hasRain && !stats.isStorm) createBadge(t.warnRain, 'warn');
            if (stats.alerts.includes('cold') && !stats.alerts.includes('freeze')) createBadge(t.warnCold, 'cold');
            if (alertsCont.innerHTML === '') createBadge(t.safe, 'safe');

            drawChart(dayData);
        }

        function createBadge(text, type) {
            const badge = document.createElement('div');
            badge.className = `badge ${type}`;
            badge.innerText = text;
            document.getElementById('alertsContainer').appendChild(badge);
        }

        const backgroundPlugin = {
            id: 'bgPlugin',
            beforeDraw: (chart) => {
                const ctx = chart.ctx;
                const xAxis = chart.scales.x;
                const yAxis = chart.scales.y;
                const top = yAxis.top;
                const bottom = yAxis.bottom;
                
                if(!weatherDataCache) return;
                const dayData = weatherDataCache[selectedDayIndex];
                const sunrise = dayData.sunrise;
                const sunset = dayData.sunset;

                chart.data.labels.forEach((label, index) => {
                    const hour = parseInt(label.split(':')[0]);
                    if(hour < sunrise || hour >= sunset) {
                         const xStart = xAxis.getPixelForValue(index);
                         let width = 0;
                         if (index < chart.data.labels.length - 1) width = xAxis.getPixelForValue(index+1) - xStart;
                         else width = xStart - xAxis.getPixelForValue(index-1);
                         ctx.fillStyle = 'rgba(20, 30, 60, 0.4)';
                         ctx.fillRect(xStart - width/2, top, width, bottom - top);
                    }
                });

                if (selectedDayIndex === 0) {
                    const currentHour = new Date().getHours();
                    const nowLabel = currentHour + ':00';
                    const idx = chart.data.labels.indexOf(nowLabel);
                    if(idx >= 0) {
                        const xPos = xAxis.getPixelForValue(idx);
                        ctx.fillStyle = 'rgba(0,0,0,0.6)'; 
                        ctx.fillRect(xAxis.left, top, xPos - xAxis.left, bottom - top);
                        ctx.beginPath();
                        ctx.moveTo(xPos, top);
                        ctx.lineTo(xPos, bottom);
                        ctx.strokeStyle = '#fff';
                        ctx.setLineDash([4, 4]);
                        ctx.lineWidth = 1;
                        ctx.stroke();
                    }
                }
            }
        };

        function drawChart(dayData) {
            const ctx = document.getElementById('weatherChart').getContext('2d');
            if(chartInstance) chartInstance.destroy();

            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: dayData.hourly.times,
                    datasets: [
                        { type: 'line', data: dayData.hourly.temps, borderColor: '#00ff9d', borderWidth: 3, yAxisID: 'y', tension: 0.4, pointRadius: 0 },
                        { type: 'bar', data: dayData.hourly.rain, backgroundColor: 'rgba(0, 213, 255, 0.3)', yAxisID: 'y1' }
                    ]
                },
                options: {
                    responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
                    plugins: { legend: { display: false }, tooltip: { backgroundColor: '#222', titleColor:'#fff', bodyColor:'#ccc' } },
                    scales: {
                        x: { ticks: { color: '#ccc', maxTicksLimit: 8 }, grid: { display: false } },
                        y: { type: 'linear', display: true, position: 'left', ticks: { color: '#ccc' }, grid: { color: 'rgba(255,255,255,0.1)' } },
                        y1: { type: 'linear', display: true, position: 'right', min: 0, max: 100, grid: { display: false }, ticks: { display: false } }
                    }
                },
                plugins: [backgroundPlugin]
            });
        }

        function renderForecastList() {
            const list = document.getElementById('forecastList');
            list.innerHTML = '';
            const t = STRINGS[currentLang];

            weatherDataCache.forEach((dayData, index) => {
                const date = new Date(dayData.date);
                let dayName = t.days[date.getDay()];
                if(index === 0) dayName = t.today;
                
                const div = document.createElement('div');
                div.className = 'forecast-item';
                div.id = `day-btn-${index}`;
                div.onclick = () => selectDay(index); 
                
                div.innerHTML = `
                    <div class="f-day">${dayName}</div>
                    <div class="f-detail">
                        <span style="color:#aaa;">${dayData.dailyMin}° / ${dayData.dailyMax}°</span>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        function updateListSelection(selectedIndex) {
            for(let i=0; i<4; i++) {
                const el = document.getElementById(`day-btn-${i}`);
                if(el) {
                    if(i === selectedIndex) el.classList.add('active');
                    else el.classList.remove('active');
                }
            }
        }

        function updateDynamicBackground(sunriseStr, sunsetStr) {
            const now = new Date();
            const sunrise = new Date(sunriseStr);
            const sunset = new Date(sunsetStr);

            const currentMins = now.getHours() * 60 + now.getMinutes();
            const riseMins = sunrise.getHours() * 60 + sunrise.getMinutes();
            const setMins = sunset.getHours() * 60 + sunset.getMinutes();
            const transition = 60; 
            let gradient = '';

            if (currentMins < riseMins - transition) gradient = "linear-gradient(to bottom, #000000, #080a10)";
            else if (currentMins < riseMins + transition) gradient = "linear-gradient(to bottom, #0f0c29, #302b63, #24243e)"; 
            else if (currentMins < setMins - transition) gradient = "linear-gradient(to bottom, #1a1a1a, #252525)"; 
            else if (currentMins < setMins + transition) gradient = "linear-gradient(to bottom, #203a43, #2c5364)"; 
            else gradient = "linear-gradient(to bottom, #000000, #080a10)";

            document.body.style.background = gradient;
        }

        function haversineDist(lat1, lon1, lat2, lon2) {
            const R = 6371; 
            const dLat = (lat2 - lat1) * Math.PI / 180;
            const dLon = (lon2 - lon1) * Math.PI / 180;
            const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
                      Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
                      Math.sin(dLon/2) * Math.sin(dLon/2);
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
        }

        async function findFuel() {
            const btn = document.getElementById('fuelBtn');
            const t = STRINGS[currentLang];
            btn.innerText = t.searchStr;
            btn.onclick = null; 

            const query = `[out:json][timeout:15];(node(around:50000,${currentLat},${currentLon})["amenity"="fuel"];way(around:50000,${currentLat},${currentLon})["amenity"="fuel"];);out body;>;out skel qt;`;
            const url = `https://overpass-api.de/api/interpreter?data=${encodeURIComponent(query)}`;

            try {
                const res = await fetch(url);
                const data = await res.json();

                if (!data.elements || data.elements.length === 0) {
                    btn.innerText = t.noneStr;
                    setTimeout(resetActionButtons, 3000);
                    return;
                }

                let nearest = null;
                let minDist = Infinity;

                data.elements.forEach(el => {
                    let lat = el.lat;
                    let lon = el.lon;
                    if (lat && lon) {
                        const d = haversineDist(currentLat, currentLon, lat, lon);
                        if (d < minDist) {
                            minDist = d;
                            nearest = el;
                        }
                    }
                });

                if (!nearest) {
                    btn.innerText = t.noneStr;
                    setTimeout(resetActionButtons, 3000);
                    return;
                }

                const stName = nearest.tags?.name || nearest.tags?.brand || t.gasStation;
                const distStr = minDist.toFixed(1);
                const mapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${nearest.lat},${nearest.lon}`;

                btn.innerHTML = `⛽ ${stName} (${distStr}km) ➔ GO`;
                btn.style.background = "#fff";
                btn.style.color = "#000";
                btn.onclick = () => window.open(mapsUrl, '_blank');

            } catch (e) {
                btn.innerText = t.errStr;
                setTimeout(resetActionButtons, 3000);
            }
        }

        async function findMedical() {
            const btn = document.getElementById('medBtn');
            const t = STRINGS[currentLang];
            btn.innerText = t.searchStr;
            btn.onclick = null; 

            const query = `[out:json][timeout:15];(node(around:50000,${currentLat},${currentLon})["amenity"~"hospital|clinic"];way(around:50000,${currentLat},${currentLon})["amenity"~"hospital|clinic"];rel(around:50000,${currentLat},${currentLon})["amenity"~"hospital|clinic"];);out center;`;

            try {
                const res = await fetch(url);
                const data = await res.json();

                if (!data.elements || data.elements.length === 0) {
                    btn.innerText = t.noneStr;
                    setTimeout(resetActionButtons, 3000);
                    return;
                }

                let nearest = null;
                let minDist = Infinity;

                data.elements.forEach(el => {
                    let lat = el.lat || el.center?.lat;
                    let lon = el.lon || el.center?.lon;
                    if (lat && lon) {
                        const d = haversineDist(currentLat, currentLon, lat, lon);
                        if (d < minDist) {
                            minDist = d;
                            nearest = { lat, lon, tags: el.tags };

                    }
                });

                if (!nearest) {
                    btn.innerText = t.noneStr;
                    setTimeout(resetActionButtons, 3000);
                    return;
                }

                const stName = nearest.tags?.name || t.medicalCenter;
                const distStr = minDist.toFixed(1);
                const mapsUrl = `https://www.google.com/maps/dir/?api=1&destination=${nearest.lat},${nearest.lon}`;

                btn.innerHTML = `🏥 ${stName} (${distStr}km) ➔ GO`;
                btn.style.background = "#fff";
                btn.style.color = "#000";
                btn.onclick = () => window.open(mapsUrl, '_blank');

            } catch (e) {
                btn.innerText = t.errStr;
                setTimeout(resetActionButtons, 3000);
            }
        }

        async function findSOS() {
            const btn = document.getElementById('sosBtn');
            const t = STRINGS[currentLang];
            btn.innerText = t.searchStr;
            btn.onclick = null; 
            
            const query = `[out:json][timeout:10];way(around:100,${currentLat},${currentLon})["highway"="motorway"];out;`;
            const url = `https://overpass-api.de/api/interpreter?data=${encodeURIComponent(query)}`;
            
            try {
                const res = await fetch(url);
                const data = await res.json();
                
                let phone = "112";
                let opName = "112 (SOS)";
                
                if (data.elements && data.elements.length > 0) {
                    const way = data.elements[0];
                    const name = (way.tags?.name || "").toLowerCase();
                    const ref = (way.tags?.ref || "").toUpperCase();
                    
                    if (name.includes("αττική") || ref.includes("A6")) { phone = "1077"; opName = "Αττική Οδός"; }
                    else if (name.includes("εγνατία") || ref.includes("A2")) { phone = "1077"; opName = "Εγνατία Οδός"; }
                    else if (name.includes("ολυμπία") || ref.includes("A8")) { phone = "1024"; opName = "Ολυμπία Οδός"; }
                    else if (name.includes("μορέας") || ref.includes("A7")) { phone = "1025"; opName = "Μορέας (Α7)"; }
                    else if (name.includes("ιόνια") || ref.includes("A5")) { phone = "1075"; opName = "Ιόνια Οδός"; }
                    else if (ref.includes("A3")) { phone = "1075"; opName = "Κεντρική Οδός (E65)"; }
                    else if (ref.includes("A1")) {
                        if (currentLat < 38.8) { phone = "1075"; opName = "Νέα Οδός (Α1)"; }
                        else if (currentLat < 40.5) { phone = "1144"; opName = "Αυτοκινητόδρομος Αιγαίου"; }
                        else { phone = "1077"; opName = "Εγνατία Οδός / Α1"; }
                    }
                }
                
                btn.innerHTML = `📞 ${opName} ➔ ${phone}`;
                btn.style.background = "#fff";
                btn.style.color = "#000";
                btn.onclick = () => window.location.href = `tel:${phone}`;
                
            } catch (e) {
                btn.innerHTML = `📞 112 (SOS)`;
                btn.style.background = "#fff";
                btn.style.color = "#000";
                btn.onclick = () => window.location.href = `tel:112`;
            }
        }

        function getLocation() {
            if (navigator.geolocation) {
                document.getElementById('currentLocDisplay').innerText = "Locating...";
                navigator.geolocation.getCurrentPosition(p => {
                    currentLat = p.coords.latitude;
                    currentLon = p.coords.longitude;
                    localStorage.setItem('motoLat', currentLat);
                    localStorage.setItem('motoLon', currentLon);
                    localStorage.setItem('motoName', "GPS Location");
                    currentCityName = "GPS Location";
                    document.getElementById('currentLocDisplay').innerText = "📍 GPS Location";
                    fetchWeather();
                }, () => alert("Denied"));
            }
        }

        async function searchLocation() {
            const query = document.getElementById('locInput').value;
            if(!query) return;
            const url = `https://geocoding-api.open-meteo.com/v1/search?name=${query}&count=1&language=el&format=json`;
            try {
                const res = await fetch(url);
                const data = await res.json();
                if(data.results && data.results.length > 0) {
                    const place = data.results[0];
                    currentLat = place.latitude;
                    currentLon = place.longitude;
                    const name = `${place.name}, ${place.country_code}`;
                    currentCityName = name;
                    document.getElementById('currentLocDisplay').innerText = `📍 ${name}`;
                    localStorage.setItem('motoLat', currentLat);
                    localStorage.setItem('motoLon', currentLon);
                    localStorage.setItem('motoName', name);
                    fetchWeather();
                } else {
                    alert("Not Found");
                }
            } catch(e) { console.error(e); }
        }
